name: Laravel Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, dom, fileinfo, mysql, gd
        coverage: none

    - name: Copy .env
      run: cp .env.example .env || echo "No .env.example found"

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run Migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Run PHP Syntax Checks
      run: |
        find app -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"

    - name: Execute tests (Unit and Feature tests)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

    - name: Check for Filament Errors
      run: |
        echo "Checking for common Filament v4 errors..."
        ! grep -r "Forms\\Components\\Grid" app/Filament || (echo "ERROR: Grid component found - use columns() instead" && exit 1)
        ! grep -r "Forms\\Components\\Section" app/Filament || (echo "WARNING: Section should be Schemas\\Components\\Section")
        echo "✅ Filament checks passed"
